<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | AI Government Scheme Identifier</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="/" class="nav-brand">
      🇮🇳 AI Scheme Finder <span class="badge-ai">Gemini AI</span>
    </a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/form">Find Schemes</a></li>
      <li><a href="/results">Results Dashboard</a></li>
    </ul>
  </nav>

  <!-- Container -->
  <div class="container" style="max-width: 500px; padding-top: 3rem;">
    <div class="form-card">
      <div class="form-header" style="text-align: center;">
        <h2>🔐 Welcome Back</h2>
        <p>Log in to access your saved government scheme recommendations.</p>
      </div>

      <form id="loginForm">
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label for="email">Email Address <span style="color: red;">*</span></label>
          <input type="email" id="email" name="email" class="form-control" placeholder="e.g. user@example.com" required>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="password">Password <span style="color: red;">*</span></label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <div id="errorMsg" style="color: #dc2626; font-size: 0.9rem; margin-bottom: 1rem; display: none;"></div>

        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">
          Log In
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account yet? <a href="/register" style="color: var(--primary-color); font-weight: 600;">Register Here</a>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2026 AI Government Scheme Identifier | Powered by Google Gemini API & Node.js</p>
  </footer>

  <script src="/js/i18n.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success) {
          Auth.setSession(data.token, data.user);
          window.location.href = '/form';
        } else {
          errorMsg.textContent = data.error || 'Invalid credentials.';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = 'Connection error. Please try again.';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
